<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ADOR OS app icon: the ADOR Λ in off-white warming to gold, with a faint warm glow, on pure black (#000000) — same black as the app itself. -->
